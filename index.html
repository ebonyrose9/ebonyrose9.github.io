  .intro, .info { flex: 0 0 auto; height: 64vh; display: flex; flex-direction: column; }

  figcaption .n { color: var(--muted); }
  figure img, figure video {

  figure img:hover { opacity: .88; }
  .top { align-self: flex-start; margin-top: 4vh; }

  @media (max-width: 640px) {

<script>
  const track = document.getElementById('track');
  const bar = document.getElementById('bar');
  // Vertical mouse wheel scrolls the strip sideways
  track.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      track.scrollLeft += e.deltaY;
      e.preventDefault();
    }
  }, { passive: false });
  // Progress line
  track.addEventListener('scroll', () => {
    const max = track.scrollWidth - track.clientWidth;
    const p = max > 0 ? track.scrollLeft / max : 0;
    bar.style.width = Math.max(4, p * 100) + '%';
  }, { passive: true });
  // Autoplay all videos (muted, looping); retry if the browser holds them back
  const vids = Array.from(document.querySelectorAll('video'));
  const playAll = () => vids.forEach((v) => {
    v.muted = true; v.defaultMuted = true; v.playsInline = true; v.loop = true;
    if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
  });
  vids.forEach((v) => {
    v.addEventListener('loadeddata', playAll);
    v.addEventListener('canplay', playAll);
  });
  playAll();
  window.addEventListener('load', playAll);
  ['scroll', 'wheel', 'pointerdown', 'touchstart', 'keydown'].forEach((ev) =>
    (ev === 'scroll' ? track : window).addEventListener(ev, playAll, { passive: true }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) playAll(); });
  document.getElementById('yr').textContent = new Date().getFullYear();
</script>
